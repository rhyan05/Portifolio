<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05080f;
      }

      .bg {
        position: absolute;
        inset: 0;
      }

      .aurora {
        background-image:
          radial-gradient(ellipse 55% 45% at 15% 10%, rgba(46, 242, 182, 0.16), transparent 65%),
          radial-gradient(ellipse 50% 55% at 85% 20%, rgba(139, 92, 246, 0.18), transparent 65%),
          radial-gradient(ellipse 45% 45% at 55% 95%, rgba(255, 77, 141, 0.12), transparent 65%);
      }

      .grid {
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        background-size: 96px 96px;
        opacity: 0.35;
        -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 80%);
        mask-image: radial-gradient(ellipse at center, black 25%, transparent 80%);
      }

      .vignette {
        background: radial-gradient(ellipse at center, transparent 30%, #05080f 92%);
      }
    </style>
  </head>
  <body>
    <div class="bg aurora"></div>
    <div class="bg grid"></div>
    <div class="bg vignette"></div>
  </body>
</html>
